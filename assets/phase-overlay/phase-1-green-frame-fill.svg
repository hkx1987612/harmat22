<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="I. utem green translucent overlay">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#39ff88" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="52" y="48" width="896" height="524" rx="4" fill="#55ff92" fill-opacity="0.24" stroke="#55ff92" stroke-width="10" filter="url(#softGlow)"/>
  <rect x="68" y="64" width="864" height="492" rx="2" fill="none" stroke="#d9ffe7" stroke-opacity="0.86" stroke-width="3"/>
</svg>
